name: SBOM

# Manual (re)generation of the CycloneDX Software Bill of Materials for an
# EXISTING release. The automatic path lives in release.yml (the `sbom` job),
# which attaches an SBOM to every tagged release. This dispatch-only workflow is
# the by-hand escape hatch: backfill a release that predates that job, or
# re-attach after a transient tooling failure — e.g. v0.2.0–v0.4.0, which
# shipped before the in-pipeline job existed.
#
# It used to trigger on `release: published`, but GitHub suppresses that event
# for releases created with the default GITHUB_TOKEN (workflow-recursion
# prevention), so it never fired for the action-gh-release releases and no SBOM
# shipped after v0.1.1. See docs/release.md "SBOM".
#
# Like the release.yml job, it scans declared dependencies from the committed
# lockfiles (Cargo.lock + extension/package-lock.json), not an installed tree (a
# fresh checkout has no node_modules/target).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)attach the SBOM to (e.g. v0.4.0)"
        required: true

permissions:
  contents: write # attach the SBOM asset to the release

jobs:
  sbom:
    name: generate-sbom
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the SBOM from the exact released code.
          ref: ${{ github.event.inputs.tag }}

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: browser-bridge.cdx.json
          # Keep a CI artifact; attach to the release explicitly below so the
          # target tag is deterministic.
          upload-artifact: true
          upload-release-assets: false

      - name: Attach SBOM to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: browser-bridge.cdx.json
          fail_on_unmatched_files: true

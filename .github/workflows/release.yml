name: Release

# Tag a version to publish prebuilt tarballs (binary + built extension +
# installer) so users don't need Rust/Node:  git tag v0.1.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write # create the GitHub Release + upload assets
  id-token: write # OIDC token to sign the SLSA build provenance
  attestations: write # write the build-provenance attestation

jobs:
  release:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel (x64) macOS is intentionally NOT built and will not be
          # re-added: Apple Silicon is the supported macOS target, and Intel
          # users can run the arm64 binary under Rosetta 2 or build from source.
          - os: macos-26
            platform: macos
            arch: arm64
          # The prebuilt Linux binary's glibc floor is set by the symbols it
          # references (~2.34, the pthread-merge point), NOT by this builder
          # image, so it runs on glibc >= 2.34 (RHEL 9, Debian 12, Ubuntu 22.04+);
          # hosts older than that build from source. To lower the floor, build on
          # an older glibc (e.g. a manylinux image) or statically link musl.
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-2025
            platform: windows
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the tag being released. On tag push github.ref_name IS the
          # tag; on workflow_dispatch the run's ref is a branch (tags can't be
          # picked in the UI), so without this we'd build main and mislabel it
          # under inputs.tag. Mirror sbom.yml, which already pins its ref.
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # The git tag is the ONLY source of the release version: the repo itself
      # stays at the 0.0.0 placeholder so nothing built off main can claim
      # to be a release (ADR-0026). Stamp Cargo.toml / Cargo.lock /
      # manifest.json / package.json here, BEFORE either build step reads them,
      # and on every matrix leg (each leg builds independently from a fresh
      # checkout). --stamped re-reads all four files and fails if any missed it.
      - name: Stamp version from tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"          # strip leading v
          CORE="${VER%%-*}"       # strip any -rc/-dev pre-release suffix
          echo "tag=$TAG version=$VER core=$CORE"
          ./scripts/stamp-version.sh "$VER"
          ./scripts/check-version.sh --stamped "$VER"

      # The CHANGELOG is the one release artifact that stays hand-written, and
      # the "bump the version" commit that used to force the author to touch it
      # is gone. Fail early rather than shipping a release with no notes.
      - name: Verify CHANGELOG has a section for this version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          CORE="${VER%%-*}"
          grep -qE "^## \[($VER|$CORE)\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [$CORE]' section — add the release notes before tagging"
            exit 1
          }

      - name: Build binary
        run: cargo build --release

      - name: Build extension bundle
        run: |
          npm ci
          npm run build
        working-directory: extension

      - name: Package release archive
        id: pkg
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="browser-bridge-${TAG}-${PLATFORM}-${ARCH}"
          mkdir -p "$NAME/extension"
          cp -r extension/dist "$NAME/extension/dist"
          cp install/mcp-config.example.json LICENSE README.md "$NAME/"
          if [ "$PLATFORM" = "windows" ]; then
            cp target/release/browser-bridge.exe "$NAME/"
            cp install/install.ps1 "$NAME/"
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
            sha256sum "$NAME.zip" > "$NAME.zip.sha256"
            ARCHIVE="$NAME.zip"
          else
            cp target/release/browser-bridge "$NAME/"
            cp install/install.sh "$NAME/"
            tar czf "$NAME.tar.gz" "$NAME"
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
            else
              sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
            fi
            ARCHIVE="$NAME.tar.gz"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256file=$ARCHIVE.sha256" >> "$GITHUB_OUTPUT"

      # The built extension bundle is platform-independent, so we emit the
      # standalone zip on ONLY the macos/arm64 leg to avoid uploading duplicate
      # (conflicting) assets from both matrix legs. The linux leg skips this
      # step, and `assets` below is empty there (harmless blank lines in the
      # upload glob), so its release upload still matches only its own tarball.
      - name: Package standalone extension zip
        id: extzip
        if: matrix.platform == 'macos'
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="browser-bridge-extension-${TAG}"
          sha() {
            if command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" > "$1.sha256"
            else sha256sum "$1" > "$1.sha256"; fi
          }
          # Two zips with the SAME contents but DIFFERENT `key` handling — they
          # cannot be merged, because the two install paths need opposite things:
          #
          # (1) $NAME.zip — "Load unpacked" (developers): manifest.json at the zip
          #     root, `key` KEPT. The key derives the pinned extension ID the
          #     native host's allowed_origins trusts; without it an unpacked load
          #     gets a path-derived ID and native messaging is refused.
          (cd extension/dist && zip -rX "../../$NAME.zip" . -x ".*")
          sha "$NAME.zip"
          # (2) $NAME-store.zip — Chrome Web Store upload: same files but the
          #     manifest `key` is STRIPPED. The published store item's manifest
          #     has no `key` (the store owns the signing key that derives the
          #     store ID), so an update upload must NOT carry one — otherwise the
          #     dashboard rejects it: "manifest key does not match current
          #     content". The store ID is already trusted via dual-ID (ADR-0019).
          rm -rf store-pkg && cp -r extension/dist store-pkg
          node -e 'const fs=require("fs");const f="store-pkg/manifest.json";const m=JSON.parse(fs.readFileSync(f,"utf8"));delete m.key;fs.writeFileSync(f,JSON.stringify(m,null,2));'
          (cd store-pkg && zip -rX "../$NAME-store.zip" . -x ".*")
          sha "$NAME-store.zip"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          {
            echo "assets<<EOF"
            echo "$NAME.zip"
            echo "$NAME.zip.sha256"
            echo "$NAME-store.zip"
            echo "$NAME-store.zip.sha256"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pkg.outputs.archive }}

      # Attest both standalone extension zips on the same (macos) leg that built them.
      - name: Attest extension zip provenance
        if: matrix.platform == 'macos'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.extzip.outputs.name }}.zip
            ${{ steps.extzip.outputs.name }}-store.zip

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.sha256file }}
            ${{ steps.extzip.outputs.assets }}
          fail_on_unmatched_files: true
          # Generate the auto "What's Changed" notes on ONE leg only. This step
          # runs on every matrix leg (each uploads its own platform asset to the
          # shared release), and generate_release_notes on each leg concatenates
          # a fresh notes block into the body — three legs produced three
          # duplicate "What's Changed" sections. The other legs pass no body, and
          # softprops preserves the existing release body, so notes land once.
          generate_release_notes: ${{ matrix.platform == 'macos' }}
          # any tag with a suffix (v0.1.0-dev, -rc.1, …) is a prerelease
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}

  # Software Bill of Materials — generated from the committed lockfiles
  # (Cargo.lock + extension/package-lock.json) and attached to the SAME release
  # as CycloneDX JSON. This lives here as a job rather than in a separate
  # `release: published` workflow because GitHub suppresses that event for
  # releases created with the default GITHUB_TOKEN (workflow-recursion
  # prevention) — the old standalone sbom.yml therefore silently stopped
  # attaching SBOMs after v0.1.1 (see docs/release.md).
  #
  # The decoupling intent is preserved WITHOUT the event: `needs: release` makes
  # this start only once the binaries are already published, and
  # `continue-on-error` keeps any SBOM-tooling failure from ever failing the
  # release run. sbom.yml survives as a workflow_dispatch-only tool to backfill
  # or re-attach an SBOM to an existing release by hand.
  sbom:
    name: sbom
    needs: [release]
    runs-on: ubuntu-22.04
    continue-on-error: true # an SBOM-tooling failure must never fail the release
    permissions:
      contents: write # attach the SBOM asset to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the SBOM from the exact released code (same ref as the matrix).
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # The SBOM is generated from the COMMITTED lockfiles, which since ADR-0026
      # carry the 0.0.0 placeholder — so without stamping first, the SBOM names a
      # root component version that does not exist. Caught by the v0.6.0-rc.1
      # rehearsal, which shipped an SBOM claiming `browser-bridge 0.0.0` next to
      # binaries correctly reporting 0.6.0-rc.1. An SBOM whose version cannot be
      # correlated with the artifact it describes is worse than none.
      #
      # This job is deliberately separate from the build matrix (it must never
      # block the binary release), so it has to repeat the stamp on its own
      # checkout rather than inheriting one.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Stamp version from tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          ./scripts/stamp-version.sh "$VER"
          ./scripts/check-version.sh --stamped "$VER"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          # Scan declared dependencies from the committed lockfiles; a fresh
          # checkout has no node_modules/target tree to walk.
          path: .
          format: cyclonedx-json
          output-file: browser-bridge.cdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attach SBOM to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: browser-bridge.cdx.json
          fail_on_unmatched_files: true
